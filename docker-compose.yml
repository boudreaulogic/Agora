version: '3.8'
services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: agora-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: agora
      # Enforce scram-sha-256 auth — rejects plaintext/md5 connections
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agora"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - agora-network
    security_opt:
      - no-new-privileges:true
    # NO ports: section — only accessible within Docker network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # WebSocket Server
  ws-server:
    build:
      context: ./ws-server
      dockerfile: Dockerfile
    container_name: agora-ws-server
    restart: unless-stopped
    environment:
      WS_PORT: 3001
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      BROADCAST_SECRET: ${BROADCAST_SECRET}
    ports:
      - "3001:3001"
    expose:
      - "3002"
    networks:
      - agora-network
    depends_on:
      - postgres
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  # Next.js Web Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: agora-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agora:${POSTGRES_PASSWORD}@postgres:5432/agora?schema=public
      NEXTAUTH_URL: ""
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      BROADCAST_SECRET: ${BROADCAST_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      NODE_ENV: production
      # Prefer IPv4 for outbound DNS. Docker Desktop's default bridge has no
      # routable IPv6, but Microsoft endpoints (login.microsoftonline.com,
      # graph.microsoft.com) return AAAA records first — Node's fetch then tries
      # the dead IPv6 path and fails with a bare "fetch failed" instead of
      # falling back to IPv4. This makes outbound connectors (SharePoint, Google,
      # etc.) resolve IPv4 first and connect reliably.
      # --require preloads preload-ipv4.js (baked into the image) before the
      # Next server starts, forcing outbound connections onto IPv4. The
      # dns-result-order flag complements it; the preload is what actually
      # disables Happy-Eyeballs IPv6 racing (the cause of ENETUNREACH on the
      # SharePoint/Google connectors under Docker Desktop).
      NODE_OPTIONS: "--dns-result-order=ipv4first --require /app/preload-ipv4.js"
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
    volumes:
      - uploads-data:/app/uploads
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - agora-network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
  # ==========================================================================
  # Maintenance Daemon — zero-touch cleanup service
  # Runs daily (3 AM) and weekly (4 AM Sunday) cleanup tasks
  # ==========================================================================
  maintenance:
    build:
      context: ./maintenance
      dockerfile: Dockerfile
    container_name: agora-maintenance
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://agora:${POSTGRES_PASSWORD}@postgres:5432/agora?schema=public
      # Override retention periods if desired (in days)
      # NOTIFICATION_RETENTION_DAYS: 90
      # ACTIVITY_LOG_RETENTION_DAYS: 21
      # AUDIT_LOG_RETENTION_DAYS: 365
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - maintenance-logs:/var/log/agora-maintenance
    networks:
      - agora-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
  # Automation Scheduler — checks scheduled automations every minute
  automation-cron:
    image: curlimages/curl:latest
    container_name: agora-automation-cron
    restart: unless-stopped
    entrypoint: /bin/sh
    command: >
      -c 'echo "Automation scheduler starting..."; while true; do
        curl -s -H "X-Cron-Secret: ${CRON_SECRET}" "http://web:3000/api/automations/cron" || true;
        sleep 60;
      done'
    depends_on:
      - web
    networks:
      - agora-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
volumes:
  postgres-data:
    driver: local
  maintenance-logs:
    driver: local
  uploads-data:
    driver: local
networks:
  agora-network:
    driver: bridge