# =============================================================================
# AGORA DMZ + CLOUDFLARE TUNNEL
# =============================================================================
# docker compose -f docker-compose.yml -f docker-compose.dmz.yml up -d
#
# Traffic flow:
#   Internet → Cloudflare → cloudflared tunnel → agora-dmz (port 80) → agora-web (port 3000)
#
# Only /forms, /approvals, /api/v1, /api/public, /api/webhooks pass through.
# =============================================================================

services:
  # DMZ Proxy — filters traffic before it reaches Agora
  dmz:
    image: nginx:alpine
    container_name: agora-dmz
    restart: unless-stopped
    volumes:
      - ./dmz/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - agora-network

  # Cloudflare Tunnel — connects DMZ to the internet via Cloudflare
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: agora-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - dmz
    networks:
      - agora-network