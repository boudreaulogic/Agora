<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Test</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1e1e1e; color: #fff; }
        button { margin: 5px; padding: 10px; cursor: pointer; }
        #log { background: #000; padding: 10px; margin-top: 20px; height: 400px; overflow-y: auto; }
        .message { margin: 5px 0; }
        .sent { color: #4CAF50; }
        .received { color: #2196F3; }
        .error { color: #f44336; }
    </style>
</head>
<body>
    <h1>Agora WebSocket Test</h1>
    <div>
        <button onclick="connect()">Connect</button>
        <button onclick="disconnect()">Disconnect</button>
        <button onclick="register()">Register User</button>
        <button onclick="focusCell()">Focus Cell</button>
        <button onclick="blurCell()">Blur Cell</button>
        <button onclick="updateCell()">Update Cell</button>
    </div>
    <div id="log"></div>

    <script>
        let ws = null;
        const userId = 'test-user-' + Math.random().toString(36).substr(2, 9);
        const tableId = 'test-table-123';

        function log(message, type = 'message') {
            const logEl = document.getElementById('log');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        function connect() {
            if (ws) {
                log('Already connected!', 'error');
                return;
            }

            ws = new WebSocket('ws://localhost:3001');

            ws.onopen = () => {
                log('✅ Connected to WebSocket server', 'sent');
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                log(`📥 Received: ${JSON.stringify(data, null, 2)}`, 'received');
            };

            ws.onclose = () => {
                log('❌ Disconnected from server', 'error');
                ws = null;
            };

            ws.onerror = (error) => {
                log(`❌ Error: ${error.message}`, 'error');
            };
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
                log('Disconnected', 'sent');
            }
        }

        function send(message) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('Not connected!', 'error');
                return;
            }
            ws.send(JSON.stringify(message));
            log(`📤 Sent: ${JSON.stringify(message, null, 2)}`, 'sent');
        }

        function register() {
            send({ type: 'register', userId, tableId });
        }

        function focusCell() {
            send({
                type: 'cell-focus',
                userId,
                userName: 'Test User',
                tableId,
                cellId: 'row-1-col-1',
                color: '#3B82F6'
            });
        }

        function blurCell() {
            send({
                type: 'cell-blur',
                userId,
                tableId,
                cellId: 'row-1-col-1'
            });
        }

        function updateCell() {
            send({
                type: 'cell-update',
                userId,
                tableId,
                rowId: 'row-1',
                columnId: 'col-1',
                value: 'Hello from ' + userId
            });
        }
    </script>
</body>
</html>
